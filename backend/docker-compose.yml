version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nakama-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nakama}
      POSTGRES_USER: ${POSTGRES_USER:-nakama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nakama_secret_pass_2026}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Exposed locally for development debugging; in production private VPC only
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nakama} -d ${POSTGRES_DB:-nakama}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nakama-network

  nakama:
    image: heroiclabs/nakama:3.22.0
    container_name: nakama-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres://${POSTGRES_USER:-nakama}:${POSTGRES_PASSWORD:-nakama_secret_pass_2026}@postgres:5432/${POSTGRES_DB:-nakama}?sslmode=disable &&
        exec /nakama/nakama --config /nakama/data/local.yml --database.address postgres://${POSTGRES_USER:-nakama}:${POSTGRES_PASSWORD:-nakama_secret_pass_2026}@postgres:5432/${POSTGRES_DB:-nakama}?sslmode=disable
    volumes:
      - ./nakama/local.yml:/nakama/data/local.yml:ro
      - ./nakama/data:/nakama/data
    ports:
      - "7349:7349" # gRPC API
      - "7350:7350" # HTTP API & WebSocket
      - "7351:7351" # Web Developer Console (Admin)
    environment:
      - NAKAMA_NAME=nakama-16guti-node1
      - NAKAMA_RUNTIME_ENV_GAME_DURATION_SEC=${GAME_DURATION_SEC:-300}
      - NAKAMA_RUNTIME_ENV_MAX_REWARDED_ADS=${MAX_REWARDED_ADS:-5}
      - NAKAMA_RUNTIME_ENV_MIN_CLIENT_VERSION=${MIN_CLIENT_VERSION:-1.0.0}
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nakama-network

volumes:
  postgres-data:
    name: nakama-postgres-data

networks:
  nakama-network:
    name: nakama-network
    driver: bridge
